name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall lance `nuxt prepare`, qui génère .nuxt/ dont dépend la config ESLint
      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Prettier
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
