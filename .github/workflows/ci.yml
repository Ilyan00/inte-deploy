name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Avant l'install : pas de dépendance, et une traduction manquante échoue tout de suite
      - name: Traductions
        run: node scripts/check-i18n.mjs

      # postinstall lance `nuxt prepare`, qui génère .nuxt/ dont dépend la config ESLint
      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Prettier
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  deploiement:
    name: Déploiement Vercel
    # Vercel ne déploie plus seul (vercel.json) : c'est la CI verte qui décide.
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploiement-vercel
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: npm install -g vercel@61.0.0

      # Récupère les réglages et les variables de prod (NUXT_PUBLIC_API_URL…) du projet Vercel.
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Build sur le runner puis upload du résultat : c'est le code testé juste avant qui part.
      # Sur GitHub Actions, Nitro détecte l'environnement GitHub et non Vercel :
      # sans ça il sort un serveur Node que Vercel ne sait pas déployer.
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NITRO_PRESET: vercel

      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
